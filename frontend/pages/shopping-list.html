<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List - RoomSync</title>
    <meta name="theme-color" content="#5B4CF0">
    <meta name="description" content="Shared shopping list with assignments and real-time check-offs.">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RoomSync">
    <meta property="og:title" content="Shopping List - RoomSync">
    <meta property="og:description" content="Shared shopping list with assignments and real-time check-offs.">
    <meta property="og:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <meta property="og:url" content="https://room-sync-kappa.vercel.app/pages/shopping-list.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shopping List - RoomSync">
    <meta name="twitter:description" content="Shared shopping list with assignments and real-time check-offs.">
    <meta name="twitter:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="page-container">
        <h2 class="text-primary-custom mb-4">Shared Shopping List</h2>
        <div id="noGroupSlot"></div>

        <!-- Add Item Form -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <form id="addItemForm" class="row g-3 align-items-center">
                    <div class="col-sm-6">
                        <label class="visually-hidden">Item Name</label>
                        <input type="text" class="form-control" id="itemName" placeholder="What do we need? (e.g. Eggs 1 dozen)" required>
                    </div>
                    <div class="col-sm-4">
                        <label class="visually-hidden">Assign To</label>
                        <select class="form-select" id="assignTo">
                            <option value="" selected>Assign To... (Optional)</option>
                            <!-- Dynamic -->
                        </select>
                    </div>
                    <div class="col-sm-2 d-grid">
                        <button type="submit" class="btn btn-primary">Add Item</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- List -->
        <div class="card shadow-sm border-0">
            <ul class="list-group list-group-flush" id="shoppingListContainer">
                <li class="list-group-item text-center text-muted py-4">Loading shopping list...</li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/shopping-list.js"></script>
</body>
</html>
