<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan to Join - RoomSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="page-container">
        <h2 class="text-primary-custom mb-3">Scan Group QR</h2>
        <p class="text-muted-custom">Point your camera at a group's QR code (shown in Group Settings). You'll be asked to join — or to send a request when the group needs approval.</p>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body text-center">
                <video id="scanVideo" class="w-100 rounded d-none" playsinline muted></video>
                <div id="scanStatus" class="text-muted py-4">Starting camera...</div>
                <button class="btn btn-outline-secondary mt-2 d-none" id="scanRetryBtn" onclick="startScanner()">Retry Camera</button>
            </div>
        </div>

        <div class="card shadow-sm border-0 d-none" id="scanResultCard">
            <div class="card-body text-center">
                <h5 class="card-title" id="scanGroupName">Group found</h5>
                <p class="text-muted-custom small" id="scanGroupMeta"></p>
                <div class="d-flex gap-2 justify-content-center">
                    <button class="btn btn-secondary" onclick="resetScanner()">Cancel</button>
                    <button class="btn btn-primary" id="scanJoinBtn" onclick="confirmScanJoin()">Join Group</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/scan.js"></script>
</body>
</html>
