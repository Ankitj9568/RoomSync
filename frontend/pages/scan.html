<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan to Join - RoomSync</title>
    <meta name="theme-color" content="#5B4CF0">
    <meta name="description" content="Scan a group's QR code with your camera to join instantly.">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RoomSync">
    <meta property="og:title" content="Scan to Join - RoomSync">
    <meta property="og:description" content="Scan a group's QR code with your camera to join instantly.">
    <meta property="og:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <meta property="og:url" content="https://room-sync-kappa.vercel.app/pages/scan.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Scan to Join - RoomSync">
    <meta name="twitter:description" content="Scan a group's QR code with your camera to join instantly.">
    <meta name="twitter:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="page-container">
        <h2 class="text-primary-custom mb-3">Scan Group QR</h2>
        <p class="text-muted-custom">Point your camera at a group's QR code (shown in Group Settings). You'll be asked to join — or to send a request when the group needs approval.</p>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body text-center">
                <video id="scanVideo" class="w-100 rounded d-none" playsinline muted></video>
                <div id="qrLibraryReader" class="d-none"></div>
                <div id="scanStatus" class="text-muted py-4">RoomSync needs camera access to scan a group QR code. Nothing is recorded.</div>
                <button class="btn btn-primary mt-2" id="scanStartBtn" onclick="requestCameraAndScan()"><i class="bi bi-camera me-2"></i>Allow Camera &amp; Scan</button>
                <button class="btn btn-outline-secondary mt-2 d-none" id="scanRetryBtn" onclick="startScanner()">Retry Camera</button>
                <div class="mt-3">
                    <div class="text-muted-custom small mb-2">No camera? Upload a QR screenshot instead.</div>
                    <button class="btn btn-outline-secondary" id="scanUploadBtn" onclick="document.getElementById('qrUploadInput').click()"><i class="bi bi-upload me-2"></i>Upload QR Image</button>
                    <input type="file" id="qrUploadInput" accept="image/*" class="d-none">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 d-none" id="scanResultCard">
            <div class="card-body text-center">
                <h5 class="card-title" id="scanGroupName">Group found</h5>
                <p class="text-muted-custom small" id="scanGroupMeta"></p>
                <div class="d-flex gap-2 justify-content-center">
                    <button class="btn btn-secondary" onclick="resetScanner()">Cancel</button>
                    <button class="btn btn-primary" id="scanJoinBtn" onclick="confirmScanJoin()">Join Group</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/scan.js"></script>
</body>
</html>
