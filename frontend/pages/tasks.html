<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - RoomSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="page-container">
        <h2 class="text-primary-custom mb-3">Household Tasks</h2>
        <div id="noGroupSlot"></div>
        <div class="mb-4 d-flex gap-2 action-toolbar" id="taskToolbar">
            <button class="btn btn-primary d-none" id="assignTaskBtn" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="prepareTaskModal()">
                <i class="bi bi-plus-circle"></i> Assign Task
            </button>
            <div class="btn-group" role="group" aria-label="Filter tasks">
                <button class="btn btn-outline-secondary active" data-task-filter="pending" onclick="setTaskFilter('pending', this)">Pending</button>
                <button class="btn btn-outline-secondary" data-task-filter="done" onclick="setTaskFilter('done', this)">Done</button>
                <button class="btn btn-outline-secondary" data-task-filter="mine" onclick="setTaskFilter('mine', this)">My Tasks</button>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Task</th>
                                <th>Category</th>
                                <th>Assigned To</th>
                                <th>Due</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tasksTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-3">Loading tasks...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Assign/Edit Task Modal (managers only) -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title text-primary-custom" id="taskModalTitle">Assign Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="taskForm">
                    <div class="modal-body">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Task</label>
                            <input type="text" class="form-control" id="taskTitle" placeholder="e.g. Cook dinner, mop floor 2" maxlength="200" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="taskCategory">
                                    <option value="cooking">Cooking</option>
                                    <option value="cleaning">Cleaning</option>
                                    <option value="utensils">Utensils / Dishes</option>
                                    <option value="laundry">Laundry</option>
                                    <option value="grocery">Grocery run</option>
                                    <option value="maintenance">Maintenance</option>
                                    <option value="security">Security round</option>
                                    <option value="other" selected>Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Repeats</label>
                                <select class="form-select" id="taskSchedule">
                                    <option value="once" selected>One time</option>
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Assign To</label>
                                <select class="form-select" id="taskAssignee">
                                    <option value="">Unassigned</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Due Date (optional)</label>
                                <input type="date" class="form-control" id="taskDueDate">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/tasks.js"></script>
</body>
</html>
