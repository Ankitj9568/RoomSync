<!DOCTYPE html>
<html lang="en">
<head>

<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RoomSync</title>
    <meta name="theme-color" content="#5B4CF0">
    <meta name="description" content="Sign in to RoomSync as a roommate, PG owner, or staff member.">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RoomSync">
    <meta property="og:title" content="Login - RoomSync">
    <meta property="og:description" content="Sign in to RoomSync as a roommate, PG owner, or staff member.">
    <meta property="og:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <meta property="og:url" content="https://room-sync-kappa.vercel.app/pages/login.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Login - RoomSync">
    <meta name="twitter:description" content="Sign in to RoomSync as a roommate, PG owner, or staff member.">
    <meta name="twitter:image" content="https://room-sync-kappa.vercel.app/og-image.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="card auth-card text-center">
            <a href="/" class="text-decoration-none" aria-label="RoomSync home">
            <h2 class="mb-4 text-primary-custom d-flex justify-content-center align-items-center">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2 text-primary-custom" style="min-width: 32px;">
                  <path d="M3 10L12 3l9 7"></path>
                  <path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10"></path>
                  <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                  <circle cx="8" cy="17" r="2" fill="var(--color-accent)" stroke="none"></circle>
                  <circle cx="16" cy="17" r="1.5" fill="currentColor"></circle>
                  <path d="M11 13L9 15.5"></path>
                  <path d="M13 13l2 2.5"></path>
                </svg>
                RoomSync
            </h2>
            </a>
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label class="form-label">I am signing in as</label>
                    <div class="btn-group w-100" role="group" aria-label="Login role">
                        <input type="radio" class="btn-check" name="loginRole" id="loginRoommate" value="roommate" checked>
                        <label class="btn btn-outline-primary" for="loginRoommate"><i class="bi bi-people me-1"></i>Roommate</label>
                        <input type="radio" class="btn-check" name="loginRole" id="loginOwner" value="owner">
                        <label class="btn btn-outline-primary" for="loginOwner"><i class="bi bi-building me-1"></i>Owner</label>
                        <input type="radio" class="btn-check" name="loginRole" id="loginStaff" value="staff">
                        <label class="btn btn-outline-primary" for="loginStaff"><i class="bi bi-tools me-1"></i>Staff</label>
                    </div>
                    <div class="form-text" id="loginRoleHint">Roommates land on the shared dashboard.</div>
                </div>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Human check <button type="button" class="btn btn-link btn-sm p-0 ms-1" onclick="refreshCaptcha('login')" title="New question"><i class="bi bi-arrow-clockwise"></i></button></label>
                    <div class="small fw-medium mb-1" id="captchaQuestion-login">Loading...</div>
                    <input type="hidden" id="captchaToken-login">
                    <input type="text" class="form-control" id="captchaAnswer-login" inputmode="numeric" placeholder="Your answer" required autocomplete="off">
                </div>
                 <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
            <form id="mfaForm" class="d-none">
                <div class="alert alert-info text-start small">
                    <i class="bi bi-shield-lock me-1"></i>
                    Owner accounts need a second step. Enter the 6-digit code from your authenticator app.
                </div>
                <div class="mb-3 text-start">
                    <label for="mfaCode" class="form-label">Authenticator code</label>
                    <input type="text" class="form-control text-center" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123 456" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Verify</button>
            </form>
            <div class="d-flex align-items-center gap-2 text-muted-custom small mb-3">
                <span class="border-top flex-grow-1"></span><span>or</span><span class="border-top flex-grow-1"></span>
            </div>
            <a href="/api/auth/google" id="googleLoginBtn" class="btn btn-outline-secondary w-100 mb-3">
                <i class="bi bi-google me-2"></i> Continue with Google
            </a>
            <div class="text-start mb-3">
                <div class="fw-medium small text-muted-custom mb-2">Signing in as <span id="loginRoleName">Roommate</span> — change above for Owner or Staff.</div>
            </div>
            <p class="text-muted-custom">Don't have an account? <a href="register.html" class="text-primary-custom text-decoration-none">Create Account</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
