<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function() {
    const theme = localStorage.getItem('roomsync-theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Group - RoomSync</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="card auth-card text-center" style="max-width: 500px; padding: 40px;">
            <div class="mb-4 d-flex justify-content-center">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary-custom">
                  <path d="M3 10L12 3l9 7"></path>
                  <path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10"></path>
                  <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                  <circle cx="8" cy="17" r="2" fill="var(--color-accent)" stroke="none"></circle>
                  <circle cx="16" cy="17" r="1.5" fill="currentColor"></circle>
                  <path d="M11 13L9 15.5"></path>
                  <path d="M13 13l2 2.5"></path>
                </svg>
            </div>
            
            <div id="loadingState">
                <div class="spinner-border text-primary-custom mb-3" role="status"></div>
                <h4 class="text-muted-custom">Loading Invite...</h4>
            </div>
            
            <div id="inviteState" class="d-none">
                <h3 class="mb-3">You've been invited!</h3>
                <p class="text-muted-custom mb-4">You have been invited to join the group:</p>
                <div class="bg-light p-3 rounded mb-4 border shadow-sm">
                    <h4 class="text-primary-custom mb-0 fw-bold" id="groupNameDisplay">Group Name</h4>
                </div>
                
                <div id="authRequiredAlert" class="alert alert-warning text-start d-none" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> You must log in or create an account before you can join this group.
                </div>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg" id="joinBtn" style="display: none;" onclick="handleJoin()">Join Now</button>
                    <a href="login.html" class="btn btn-primary btn-lg" id="loginBtn" style="display: none;">Log in to Join</a>
                    <a href="register.html" class="btn btn-outline-secondary" id="registerBtn" style="display: none;">Create an Account</a>
                    <a href="../index.html" class="btn btn-link text-muted-custom mt-2">Cancel</a>
                </div>
            </div>
            
            <div id="errorState" class="d-none">
                <i class="bi bi-x-circle text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3 mb-2">Invalid Invite</h4>
                <p class="text-muted-custom" id="errorMessage">This invite link is invalid or has expired.</p>
                <a href="../index.html" class="btn btn-outline-secondary mt-3">Go to Homepage</a>
            </div>
        </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/join.js"></script>
</body>
</html>
